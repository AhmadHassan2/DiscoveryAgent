# Optional: run everything in Docker (not required — see README for the native setup).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: idea
      POSTGRES_PASSWORD: idea-local-only
      POSTGRES_DB: idea_discovery
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idea -d idea_discovery"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://idea:idea-local-only@db:5432/idea_discovery
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      FAIL_SOURCES: ${FAIL_SOURCES:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
